name: Sync Fork with Upstream Grow

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch: # Allows manual 1-click trigger in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Upstream Changes Non-Destructively
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/creat-o-r/grow.git || true
          git fetch upstream main
          git merge upstream/main --no-edit || (echo "Merge conflict detected; please review in a PR." && git merge --abort)
          git push origin HEAD:main
